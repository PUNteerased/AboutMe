<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | PUNTEERASED</title>
    <style>
        /* --- 1. GLOBAL & HIDE SCROLLBAR --- */
        body {
            margin: 0;
            background-color: #050505; /* พื้นหลังสีดำคลีนๆ */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            
            /* ซ่อน Scrollbar สำหรับ Firefox */
            scrollbar-width: none; 
            /* ซ่อน Scrollbar สำหรับ IE/Edge */
            -ms-overflow-style: none; 
        }

        /* ซ่อน Scrollbar สำหรับ Chrome, Safari, Opera */
        body::-webkit-scrollbar { 
            display: none; 
        }

        /* --- 2. LAYOUT จัดหน้าจอ --- */
        .contact-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .contact-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            background: #111;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .contact-info, .contact-form {
            flex: 1;
            min-width: 300px;
        }

        /* --- 3. SCROLL MOTION ANIMATION (คลาสที่รอการเลื่อนเจอ) --- */
        .scroll-hidden {
            opacity: 0;
            transform: translateY(40px); /* เลื่อนต่ำลงไป 40px */
            transition: all 0.8s ease-out; /* ความนุ่มนวลตอนโผล่ขึ้นมา */
        }

        /* คลาสที่จะถูกเพิ่มด้วย JavaScript เมื่อเลื่อนมาถึง */
        .scroll-show {
            opacity: 1;
            transform: translateY(0);
        }

        /* หน่วงเวลาให้ฝั่งขวาโผล่มาช้ากว่าฝั่งซ้ายนิดนึง */
        .delay-1 { transition-delay: 0.2s; }

        /* --- 4. CONTACT INFO & SOCIAL MEDIA --- */
        h1 { font-size: 3rem; margin-top: 0; margin-bottom: 20px; }
        p { color: #aaa; line-height: 1.6; margin-bottom: 40px; }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: #fff;
            padding: 15px 20px;
            background: #1a1a1a;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #333;
        }

        /* สีตอน Hover ของแต่ละแอป */
        .social-btn.ig:hover { background: #E1306C; border-color: #E1306C; }
        .social-btn.fb:hover { background: #1877F2; border-color: #1877F2; }
        .social-btn.line:hover { background: #00B900; border-color: #00B900; }
        .social-btn.github:hover { background: #ffffff; color: #000; border-color: #fff; }

        .social-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* --- 5. FORM STYLE --- */
        .input-box {
            margin-bottom: 25px;
        }

        .input-box input, .input-box textarea {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
            font-family: inherit;
        }

        .input-box textarea { height: 120px; resize: none; }

        .input-box input:focus, .input-box textarea:focus {
            outline: none;
            border-bottom-color: #fff; /* เปลี่ยนเป็นสีขาวตอนพิมพ์ */
        }

        .submit-btn {
            background: #fff;
            color: #000;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: #ccc;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .contact-container { padding: 40px 20px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

            <div class="contact-form scroll-hidden delay-1">
                <form action="#" method="POST">
                    <div class="input-box">
                        <input type="text" placeholder="Your Name" required>

                    <div class="input-box">

                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>

        </div>
    </section>

    <script>
        // ใช้ Intersection Observer เพื่อตรวจจับว่าเลื่อนจอมาถึง Element หรือยัง
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                // ถ้ามองเห็น Element นั้นบนหน้าจอ
                if (entry.isIntersecting) {
                    entry.target.classList.add('scroll-show'); // ใส่คลาสที่ทำให้โผล่ขึ้นมา
                }
            });
        }, {
            threshold: 0.1 // ให้โผล่มาตอนที่เลื่อนมาเห็น 10% ของกล่อง
        });

        // สั่งให้ Observer เฝ้าดูทุก Element ที่มีคลาส .scroll-hidden
        const hiddenElements = document.querySelectorAll('.scroll-hidden');
        hiddenElements.forEach((el) => observer.observe(el));
    </script>

</body>
</html>
